name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check theory and routes
        run: npm run check:login && npm run check:theory && npm run check:progress && npm run check:routes && node scripts/check-personal-plan-tasks.mjs && node scripts/check-teacher-activity.mjs && node scripts/check-teacher-refresh.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
